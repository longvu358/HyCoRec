# SMOKE-TEST config for HTGReDial -- verifies the pipeline runs end-to-end on a
# tiny slice of data. Not for reporting numbers. For the full run, use
# tgredial.yaml unchanged. Mirrors redial_smoke.yaml's approach (scale +
# related_truncate + epoch cut only).
# dataset
dataset: HTGReDial
tokenize: pkuseg
# dataloader
related_truncate: 256
context_truncate: 256
response_truncate: 30
scale: 0.01
# model
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
# HyCoRec-CHANGE
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
# CPC-Hypergraph v2
scopes: [C, P, G]
k_hist: 40
k_hop: 1
context_window_w: 3
hconv_layers: 2
fusion_mode: rows7   # v2.2 Eq. 11-13: MHA(P_c, R, R) over pooled scope rows (final choice)
scope_weights: separate   # each hypergraph (C/P per field, G) owns its own HConv stack; "shared" = spec 3.1 reuse
alpha_init: [-1, 0, -1]
ei_mode: xg
freeze_alpha: false
collective_path: data/collective/htgredial
use_review_hypergraph: false
review_index_path: null
# optim
rec:
  epoch: 1
  batch_size: 64
  early_stop: False
  stop_mode: min
  impatience: 2
  optimizer:
    name: Adam
    lr: !!float 1e-3
conv:
  epoch: 1
  batch_size: 128
  impatience: 1
  optimizer:
    name: Adam
    lr: !!float 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 3
    factor: 0.5
  gradient_clip: 0.1
