# Ablation A7 (ReDial, CPC-Hypergraph v2.2 rows7, spec 6.2) -- P + G0 + h^asp (aspect-only collective), (14b)
# ReDial ladder: shared hyper-parameters are identical across ALL A* cells (rec/conv: AdamW, lr 5e-4/1e-3,
# rec epoch 10 bs64, conv epoch 5 bs32; rtx6000/ = rec bs256, conv bs64) so differences come from the toggled component
# only. Fusion: fusion_mode rows7 (v2.2). Keep in sync with ../../redial.yaml (= A9).
# [rtx6000 profile] identical to base ablation/A7.yaml except batch_size x2 (16GB GPU: V100/P100)
# dataset
dataset: HReDial
tokenize: nltk
# dataloader
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
# model
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
# HyCoRec-CHANGE
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
# CPC-Hypergraph v2 (docs/contexual_personal_collective) — full model, A9 milestone
scopes: [P, G]
k_hist: 40
k_hop: 1
context_window_w: 3   # sliding-window size w (spec v2.1 Eq. 2); w=1 degenerates to per-turn co-mention (A2 baseline)
hconv_layers: 2
fusion_mode: rows7   # v2.2 Eq. 11-13: MHA(P_c, R, R) over pooled scope rows (final choice)
scope_weights: separate   # each hypergraph (C/P per field, G) owns its own HConv stack; "shared" = spec 3.1 reuse
alpha_init: [-1, 0, -1]
ei_mode: xg
freeze_alpha: false
collective_path: data/collective/hredial_aspect
use_review_hypergraph: false
review_index_path: null       # null -> data/reviews/<dataset>/review_index.json
# optim
rec:
  epoch: 10
  batch_size: 256
  early_stop: True
  stop_mode: max   # tracks recall@50 (see train_recommender), not rec_loss
  impatience: 4
  optimizer:
    name: AdamW
    lr: !!float 5e-4
  lr_scheduler:
    name: ReduceLROnPlateau
    mode: max   # recall@50 is maximized, unlike conv's gen_loss
    patience: 1
    factor: 0.5
conv:
  epoch: 5
  batch_size: 64
  # no early_stop for conv: all epochs run, last model is tested (impatience would be unused)
  optimizer:
    name: AdamW
    lr: !!float 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 1
    factor: 0.5
  gradient_clip: 0.1