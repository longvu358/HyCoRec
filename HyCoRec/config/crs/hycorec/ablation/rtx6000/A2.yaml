# Ablation A2 (CPC-Hypergraph v2.1, spec 6.2) -- P + C, w=1 (degenerate: per-turn co-mention, ablation floor for C)
# [rtx6000 profile] identical to base ablation/A2.yaml except batch_size x2 (16GB GPU: V100/P100)
# dataset
dataset: HReDial
tokenize: nltk
# dataloader
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
# model
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
# HyCoRec-CHANGE
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
# CPC-Hypergraph v2 (docs/contexual_personal_collective) — full model (~A9 minus review)
scopes: [C, P]
k_hist: 40
k_hop: 1
context_window_w: 1
hconv_layers: 2
scope_weights: separate   # each hypergraph (C/P per field, G) owns its own HConv stack; "shared" = spec 3.1 reuse
alpha_init: [-1, 0, -1]
ei_mode: base
freeze_alpha: false
collective_path: null    # null -> data/collective/<dataset>/
# optim
rec:
  epoch: 10
  batch_size: 128
  early_stop: True
  stop_mode: max   # tracks recall@50 (see train_recommender), not rec_loss
  impatience: 3
  optimizer:
    name: Adam
    lr: !!float 5e-4
  lr_scheduler:
    name: ReduceLROnPlateau
    mode: max   # recall@50 is maximized, unlike conv's gen_loss
    patience: 1
    factor: 0.5
conv:
  epoch: 4
  batch_size: 256
  impatience: 1
  optimizer:
    name: Adam
    lr: !!float 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 3
    factor: 0.5
  gradient_clip: 0.1