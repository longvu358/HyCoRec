# A9 v2.2 (rows7 fusion + unified A_hat_G) with a separate HConv stack per hypergraph (scope_weights: separate)
# [rtx6000 profile] identical to base ablation/A9_v22_sep.yaml except batch_size x2 (16GB GPU: V100/P100)
# dataset
dataset: HReDial
tokenize: nltk
# dataloader
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
# model
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
# HyCoRec-CHANGE
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
# CPC-Hypergraph v2 (docs/contexual_personal_collective) — full model, A9 milestone
scopes: [C, P, G]
k_hist: 40
k_hop: 1
context_window_w: 3   # sliding-window size w (spec v2.1 Eq. 2); w=1 degenerates to per-turn co-mention (A2 baseline)
hconv_layers: 2
alpha_init: [-1, 0, -1]
ei_mode: xg
freeze_alpha: false
fusion_mode: rows7
scope_weights: separate
collective_path: data/collective/hredial_unified_full
use_review_hypergraph: true
review_index_path: null       # null -> data/reviews/<dataset>/review_index.json
# optim
rec:
  epoch: 10
  batch_size: 256
  early_stop: True
  stop_mode: min   # valid rec_loss (MHIM-style); lr scheduler follows the same metric
  stop_metric: rec_loss
  impatience: 4
  optimizer:
    name: AdamW
    lr: !!float 5e-4
  lr_scheduler:
    name: ReduceLROnPlateau
    mode: min
    patience: 1
    factor: 0.5
conv:
  epoch: 5
  batch_size: 64
  # no early_stop for conv: all epochs run, last model is tested (impatience would be unused)
  optimizer:
    name: AdamW
    lr: !!float 1e-3
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 1
    factor: 0.5
  gradient_clip: 0.1