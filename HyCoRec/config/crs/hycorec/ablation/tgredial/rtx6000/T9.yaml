# T9: HTGReDial full model (C+P+G + review hypergraph). Mirrors ../tgredial.yaml -- keep in sync.
# [rtx6000 profile] SAME batch_size as base (rec 128 / conv 32), NOT x2 like the ReDial cells: two seeds run concurrently on the same 4x16GB GPUs
# and HTGReDial's per-process footprint is ~2x ReDial's (T9 bs256 = 9.9GB/GPU), so two bs256 jobs OOM (log/20261004-013754 T9/T9_norev seed123).
# Shared TG hyper-parameters: see ../README.md
dataset: HTGReDial
tokenize: pkuseg
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
scopes: [C, P, G]
k_hist: 40
k_hop: 1
khop_cap: 300   # cap neighbors/hop for H^P_{E,W} (HTGReDial entity_adj has hub nodes up to ~20.6k degree)
context_window_w: 3   # sliding-window size w (spec v2.1 Eq. 2); w=1 degenerates to per-turn co-mention
hconv_layers: 2
fusion_mode: rows7   # v2.2 Eq. 11-13: MHA(P_c, R, R) over pooled scope rows (final choice)
scope_weights: separate   # each hypergraph (C/P per field, G) owns its own HConv stack; "shared" = spec 3.1 reuse
alpha_init: [-1, 0, -1]
ei_mode: xg
freeze_alpha: false
collective_path: data/collective/htgredial_full   # G0 = htgredial/ ; G full (rev+aspect) = htgredial_full/
use_review_hypergraph: true   # H^{P,rev}_E (Eq. 1r/1s); needs build_review_index.py run first
review_index_path: null       # null -> data/reviews/<dataset>/review_index.json
rec:
  epoch: 10
  batch_size: 128
  early_stop: true
  stop_mode: max   # tracks recall@50 (see train_recommender)
  impatience: 2    # valid rec_loss diverges after ~epoch 2 (train 10->4, valid 10->16); stop early
  optimizer:
    name: AdamW
    lr: 0.0002
    weight_decay: 0.01
  lr_scheduler:
    name: ReduceLROnPlateau
    mode: max
    patience: 0
    factor: 0.5
conv:
  epoch: 5
  batch_size: 32
  early_stop: true
  stop_mode: min   # valid gen_loss; best epoch is restored before test (was: last epoch, valid gen_loss bottomed at epoch 1)
  impatience: 2
  optimizer:
    name: AdamW
    lr: 0.0005
    weight_decay: 0.01
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 0
    factor: 0.5
  gradient_clip: 0.1
