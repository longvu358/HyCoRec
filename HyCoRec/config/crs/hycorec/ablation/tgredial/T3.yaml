# Ablation T3 (HTGReDial) -- P + G0 (dialogue hyperedges only), ei=base
# HTGReDial (TG-ReDial) ablation ladder -- mirrors the ReDial A-ladder (spec 6.2), see ./README.md
# Shared TG hyper-parameters (identical across ALL T* cells so differences come from the toggled component only):
#   tokenize pkuseg | khop_cap 300 (entity_adj hub 20.6k) | w=3 | AdamW lr 5e-4 (rec) / 1e-3 (conv) | rec epoch 10 bs128 | conv epoch 4 bs32
dataset: HTGReDial
tokenize: pkuseg
related_truncate: 1024
context_truncate: 256
response_truncate: 30
scale: 1
model: HyCoRec
token_emb_dim: 300
kg_emb_dim: 128
num_bases: 8
n_heads: 2
n_layers: 2
ffn_size: 300
dropout: 0.1
attention_dropout: 0.0
relu_dropout: 0.1
learn_positional_embeddings: false
embeddings_scale: true
reduction: false
n_positions: 1024
user_proj_dim: 512
mha_n_heads: 4
pooling: Mean
extension_strategy: Adaptive
scopes:
- P
- G
k_hist: 40
k_hop: 1
khop_cap: 300
context_window_w: 3
hconv_layers: 2
fusion_mode: rows7   # v2.2 Eq. 11-13: MHA(P_c, R, R) over pooled scope rows (final choice)
scope_weights: separate
alpha_init:
- -1
- 0
- -1
ei_mode: base
freeze_alpha: false
collective_path: data/collective/htgredial
use_review_hypergraph: false
review_index_path: null
rec:
  epoch: 10
  batch_size: 128
  early_stop: true
  stop_mode: min   # valid rec_loss (MHIM-style); lr scheduler follows the same metric
  stop_metric: rec_loss
  impatience: 2    # valid rec_loss diverges after ~epoch 2 (train 10->4, valid 10->16); stop early
  optimizer:
    name: AdamW
    lr: 0.0002
    weight_decay: 0.01
  lr_scheduler:
    name: ReduceLROnPlateau
    mode: min
    patience: 0
    factor: 0.5
conv:
  epoch: 5
  batch_size: 32
  early_stop: true
  stop_mode: min   # valid gen_loss; best epoch is restored before test (was: last epoch, valid gen_loss bottomed at epoch 1)
  impatience: 2
  optimizer:
    name: AdamW
    lr: 0.0005
    weight_decay: 0.01
  lr_scheduler:
    name: ReduceLROnPlateau
    patience: 0
    factor: 0.5
  gradient_clip: 0.1
